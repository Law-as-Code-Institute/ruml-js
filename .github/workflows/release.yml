name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Read the version
        id: version
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          if npm view "$name@$version" version >/dev/null 2>&1; then published=true; else published=false; fi
          {
            echo "version=$version"
            echo "dist-tag=$tag"
            echo "npm-published=$published"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.version.outputs.npm-published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm pack
          npm publish ./*.tgz --provenance --access public --tag "${{ steps.version.outputs.dist-tag }}"

      - name: Tag the release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
