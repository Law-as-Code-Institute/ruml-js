# The versions behind the `catalog:` entries of package.json; keep in step with the catalog
# of the source repository.
catalog:
  '@noble/hashes': ^1.8.0
  '@types/node': ^25.9.1
  ajv: ^8.18.0
  ajv-formats: ^3.0.1
  jsonata: ^2.2.1
  tsdown: ^0.22.3
  tsx: ^4.22.4
  typescript: ~6.0.3
  vitest: ^4.1.12
  zod: ^4.4.3
  zod-from-json-schema: ^0.5.6

# pnpm stops the install unless a build script is allowed or refused; the bundler needs esbuild.
allowBuilds:
  esbuild: true

# The schemas of a RUML release are wanted on its release day, past pnpm's release-age cooldown.
minimumReleaseAgeExclude:
  - '@law-as-code/ruml-schema'
